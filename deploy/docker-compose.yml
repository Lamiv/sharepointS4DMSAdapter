# Production-style deployment on a Docker host (Ubuntu VM).
#   cp deploy/.env.example deploy/.env   # fill in secrets
#   cp deploy/config.example.yaml deploy/config.yaml   # edit repositories
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  adapter:
    build:
      context: ..
      target: adapter
    image: sharepoint-adapter:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yaml:/etc/adapter/config.yaml:ro
      - spool:/var/spool/adapter   # disk-backed spool (not RAM)
    ports:
      - "8080:8080"              # Document REST API
      - "8090:8090"              # SAP Content Server HTTP interface (OAC0)
      - "127.0.0.1:9090:9090"    # metrics/health: localhost only
    tmpfs:
      - /tmp:size=64m
    read_only: true
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD", "/adapter", "-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    # Transfer buffers are capped by transfer.memoryBudgetBytes (512 MiB by
    # default); 1 GiB leaves room for the Go runtime and connections.
    mem_limit: 1g

volumes:
  spool:
