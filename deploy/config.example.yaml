# SharePoint adapter configuration. ${VAR} references are expanded from the
# environment; keep secrets in .env / Docker secrets, never in this file.
server:
  interfaces: [rest, contentrepo]   # rest = Document REST API, contentrepo = SAP Content Server HTTP interface
  restAddr: ":8080"
  contentRepoAddr: ":8090"
  adminAddr: ":9090"            # /metrics, /healthz, /readyz, certificate admin - do not expose publicly
  adminToken: ${ADMIN_TOKEN}    # required for certificate activation when set
  maxInFlight: 1000             # per listener; excess requests get 503 + Retry-After
  corsOrigins: []               # e.g. ["https://my-fiori-launchpad.example.com"]
  # tlsCertFile: /etc/adapter/tls/tls.crt
  # tlsKeyFile: /etc/adapter/tls/tls.key

graph:
  tenantId: ${GRAPH_TENANT_ID}
  clientId: ${GRAPH_CLIENT_ID}
  clientSecret: ${GRAPH_CLIENT_SECRET}
  maxConcurrency: 64            # simultaneous Graph calls per adapter instance
  maxRetries: 5
  maxRetryBackoff: 60s
  metadataCacheTtl: 60s

transfer:
  simpleUploadMaxBytes: 4194304     # <= 4 MiB: single PUT; above: resumable upload session
  chunkSizeBytes: 5242880           # multiple of 320 KiB
  memoryBudgetBytes: 536870912      # hard cap on all transfer buffers (512 MiB); excess requests wait
  maxUploadBytes: 2147483648        # 2 GiB
  spoolDir: /var/spool/adapter   # disk-backed volume (see docker-compose.yml)
  downloadMode: proxy               # proxy | redirect (302 to short-lived SharePoint URL)

auth:
  apiKeys:
    - name: s4hana
      key: ${ADAPTER_API_KEY_S4}         # or sha256: <hex> to avoid storing plaintext
      repositories: ["*"]
      permissions: [read, write, delete]
    - name: fiori-readonly
      key: ${ADAPTER_API_KEY_FIORI}
      repositories: [DMS]
      permissions: [read]
  # jwt:                                 # optional: Entra ID / SAP IAS access tokens
  #   issuer: https://login.microsoftonline.com/<tenant>/v2.0
  #   audience: api://sharepoint-adapter
  #   jwksUrl: https://login.microsoftonline.com/<tenant>/discovery/v2.0/keys
  #   rolesClaim: roles
  #   rolePrefix: "Documents."           # Documents.read -> read

# Where documents are stored. The location comes from deploy/.env, so this file
# does not need to change per installation:
#   SHAREPOINT_SITE_URL   site address, e.g. https://contoso.sharepoint.com/sites/SAP_DOCS
#   SHAREPOINT_LIBRARY    document library display name (empty = the site's default library)
#   SHAREPOINT_ROOT_PATH  folder inside the library for everything the adapter stores
# Alternatives to siteUrl (use ONE): userId (a OneDrive for Business, e.g. jane@contoso.com;
# needs Files.ReadWrite.All), siteId, or driveId (a Graph drive ID).
repositories:
  - id: DMS
    siteUrl: ${SHAREPOINT_SITE_URL}
    driveName: ${SHAREPOINT_LIBRARY}
    rootPath: ${SHAREPOINT_ROOT_PATH}

# SAP Content Server HTTP interface (OAC0 storage type "HTTP content server").
contentServer:
  allowedNetworks: []           # e.g. ["10.20.0.0/16"] = S/4HANA app servers + users' network for front-end access
  clockSkew: 5m                 # tolerance for the signed URL expiration
  autoActivateCertificates: false
  repositories:
    - contRep: Z1               # content repository ID created in OAC0
      description: S/4HANA DMS originals
      repository: DMS           # the repository id above (library + rootPath)
      folder: ContentServer/Z1  # below the repository root
      signature: required       # required | optional (honours docProt) | none - match OAC0 "Signature"

log:
  level: info
  format: json
