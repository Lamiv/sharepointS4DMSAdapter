name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "Run gofmt on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Tests (race detector)
        run: go test -race -count=1 ./...
      - name: Cross-compile for arm64 (build only; not run)
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/adapter

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Markdown links and anchors
        run: python3 scripts/check_docs.py

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the ZAKS Drive image
        run: docker build --target adapter -t zaks-drive:ci .
      - name: Binary starts (new and compatibility names)
        run: |
          docker run --rm --entrypoint /zaks-drive zaks-drive:ci version
          docker run --rm --entrypoint /adapter zaks-drive:ci version
          docker run --rm --entrypoint /zaks-drive zaks-drive:ci errors > /dev/null
